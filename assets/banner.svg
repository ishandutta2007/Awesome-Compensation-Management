<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <style>
      .bg-pulse {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .bg-pulse-rev {
        animation: pulseOrbRev 10s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .chart-wave {
        animation: waveShift 6s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: pillGlow 4s ease-in-out infinite alternate;
      }

      @keyframes pulseOrb {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
        100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.45; }
      }
      @keyframes pulseOrbRev {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.2; }
        100% { transform: scale(1.3) translate(-50px, 30px); opacity: 0.4; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes waveShift {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pillGlow {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
        100% { filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6)); }
      }
    </style>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)"/>

  <!-- 2. Dynamic Ambient Background Elements (Strictly Lower Z-Index) -->
  <g opacity="0.8">
    <!-- Animated Glowing Orbs -->
    <circle cx="180" cy="100" r="140" fill="#38bdf8" class="bg-pulse" filter="url(#glow)"/>
    <circle cx="1020" cy="300" r="160" fill="#818cf8" class="bg-pulse-rev" filter="url(#glow)"/>
    <circle cx="600" cy="360" r="130" fill="#c084fc" class="bg-pulse" filter="url(#glow)"/>

    <!-- Subtle Dynamic Flow Line (Lower Canvas) -->
    <path d="M -50 370 Q 300 320 600 360 T 1250 310" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" class="dash-flow" opacity="0.4"/>
    <path d="M -50 395 Q 350 340 700 380 T 1250 340" fill="none" stroke="#34d399" stroke-width="1.5" class="dash-flow" opacity="0.3"/>

    <!-- Dynamic Compensation Bar Chart in Background Right -->
    <g transform="translate(860, 110)" opacity="0.35" class="chart-wave">
      <rect x="0" y="80" width="22" height="110" rx="4" fill="url(#emeraldGrad)"/>
      <rect x="34" y="50" width="22" height="140" rx="4" fill="url(#primaryGrad)"/>
      <rect x="68" y="95" width="22" height="95" rx="4" fill="url(#amberGrad)"/>
      <rect x="102" y="30" width="22" height="160" rx="4" fill="url(#primaryGrad)"/>
      <rect x="136" y="65" width="22" height="125" rx="4" fill="url(#emeraldGrad)"/>
      <rect x="170" y="20" width="22" height="170" rx="4" fill="url(#primaryGrad)"/>
      <line x1="-10" y1="195" x2="205" y2="195" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Dynamic Compensation Metric Node in Background Left -->
    <g transform="translate(90, 240)" opacity="0.4" class="chart-wave">
      <rect x="0" y="0" width="130" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">COMPA-RATIO</text>
      <text x="14" y="50" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">1.04x</text>
      <circle cx="106" cy="32" r="10" fill="#0284c7" opacity="0.4"/>
      <path d="M 102 34 L 106 28 L 110 34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 3. Foreground Content (Strictly in Front & Always Legible) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Category Pill -->
    <g transform="translate(0, 58)">
      <rect x="-165" y="0" width="330" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" class="badge-glow"/>
      <circle cx="-140" cy="17" r="5" fill="#10b981"/>
      <text x="-124" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.8">
        CURATED AWESOME DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome Compensation Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="202" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.2">
      Open-Source Platforms, HRMS Modules, Salary Benchmarking &amp; Enterprise SaaS
    </text>

    <!-- Tagline -->
    <text x="0" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Merit Cycle Planning • Pay Equity Analytics • Total Rewards • Executive &amp; Sales Incentives
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 280)">
      <!-- Badge 1: Open Source -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="145" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="72" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">⚡ Open-Source</text>
      </g>
      <!-- Badge 2: Salary Benchmarking -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="165" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="82" y="23" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">📊 Market Surveys</text>
      </g>
      <!-- Badge 3: Pay Equity -->
      <g transform="translate(30, 0)">
        <rect x="0" y="0" width="145" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="72" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">⚖️ Pay Equity</text>
      </g>
      <!-- Badge 4: Total Rewards -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="145" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="72" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">💎 Total Rewards</text>
      </g>
    </g>

    <!-- Bottom Metadata / Community Callout -->
    <text x="0" y="375" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      Enterprise SaaS Market Intelligence • GitHub Open-Source Repositories • Star &amp; Fork to Support
    </text>
  </g>
</svg>
